name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  PNPM_VERSION: "9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: ${{ env.PYTHON_VERSION }} }
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm lint || echo "lint: no script yet"
      - run: pip install ruff && ruff check services/ai-service || echo "ruff: no ai-service yet"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: quantsmind, POSTGRES_PASSWORD: quantsmind, POSTGRES_DB: quantsmind }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: ${{ env.PYTHON_VERSION }} }
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm test || echo "tests: no script yet"
      - run: pip install -r services/ai-service/requirements.txt || echo "ai reqs missing"
      - run: pytest services/ai-service || echo "pytest: no tests yet"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config
      - run: docker build -f apps/api/Dockerfile apps/api || echo "api Dockerfile not yet"
      - run: docker build -f apps/web/Dockerfile apps/web || echo "web Dockerfile not yet"
      - run: docker build -f services/ai-service/Dockerfile services/ai-service || echo "ai Dockerfile not yet"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Playwright E2E: signup → predict → billing (mock Stripe) — runs against docker-compose"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy to Fly.io/Render staging — flyctl deploy / render deploy"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy to production — manual approval gate"
